name: Release

# Tag a version to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
# Each OS builds its own installers; the job only packages if typecheck + tests
# pass first, so a broken tag never produces artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual runs build + upload artifacts, but publish no release

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
          - os: ubuntu-latest
            dist: dist:linux

    steps:
      - uses: actions/checkout@v4

      # Version comes from the `packageManager` field in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 24 matches the local dev environment. `node:sqlite` is unflagged
          # from 22.13 / 24 onwards, which @kumi/core depends on.
          node-version: 24
          cache: pnpm

      # `onlyBuiltDependencies` in the root package.json already allowlists the
      # packages permitted to run install scripts, so a plain frozen install is
      # both reproducible and non-interactive.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Gate: compile every package (@kumi/core must emit dist/ before packaging
      # — the desktop main process require()s it at runtime), typecheck, test.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Package
        run: pnpm --filter @kumi/desktop ${{ matrix.dist }}
        env:
          # Unsigned personal-use builds: never search the keychain for an
          # identity, and do not attempt notarization.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kumi-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.blockmap

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          # Each OS contributes only its own artifact types, so the other
          # patterns legitimately match nothing.
          fail_on_unmatched_files: false
          body: |
            Kumi ${{ github.ref_name }} — local-only, agent-native workspace.

            Installers are **unsigned**: Windows SmartScreen shows
            "More info → Run anyway"; macOS needs right-click → Open the first time.
          files: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
